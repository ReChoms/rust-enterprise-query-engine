apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-enterprise-query-engine
  labels:
    app.kubernetes.io/name: rust-enterprise-query-engine
    app.kubernetes.io/part-of: rust-enterprise-query-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-enterprise-query-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-enterprise-query-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # 1. Main Rust Enterprise Query Engine Container
        - name: query-engine
          image: rust-enterprise-query-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: rust-enterprise-query-engine-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: sap-storage
              mountPath: /app/data
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2

        # 2. Local Ollama LLM Sidecar Container
        - name: ollama-sidecar
          image: docker.io/ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: ollama
          env:
            - name: HOME
              value: /home/nonroot
            - name: OLLAMA_MODELS
              value: /home/nonroot/.ollama/models
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: ollama-storage
              mountPath: /home/nonroot/.ollama

      volumes:
        - name: sap-storage
          persistentVolumeClaim:
            claimName: rust-enterprise-query-engine-pvc
        - name: tmp-volume
          emptyDir: {}
        - name: ollama-storage
          emptyDir: {}
